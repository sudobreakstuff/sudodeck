<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="snakeGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00aa55;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="64" fill="#0d1117"/>
  <rect width="512" height="512" rx="64" fill="none" stroke="#00ff88" stroke-width="4" opacity="0.3"/>

  <!-- Snake body - coiled S shape -->
  <path d="M256 96 C320 96 360 140 360 200 C360 260 320 280 280 280 C240 280 220 260 220 220 C220 180 240 160 280 160 C320 160 340 180 340 220 C340 280 300 320 260 340 C220 360 200 380 200 410" 
        stroke="url(#snakeGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Inner highlight line -->
  <path d="M256 96 C320 96 360 140 360 200 C360 260 320 280 280 280 C240 280 220 260 220 220 C220 180 240 160 280 160 C320 160 340 180 340 220 C340 280 300 320 260 340 C220 360 200 380 200 410"
        stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

  <!-- Snake head -->
  <ellipse cx="200" cy="410" rx="14" ry="10" fill="#00ff88" transform="rotate(-15 200 410)"/>

  <!-- Snake eyes -->
  <circle cx="194" cy="407" r="2.5" fill="#0d1117"/>
  <circle cx="188" cy="413" r="2.5" fill="#0d1117"/>

  <!-- Tongue -->
  <path d="M186 415 C182 420 178 425 176 428" stroke="#ff4466" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M176 428 L172 430 M176 428 L176 433" stroke="#ff4466" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Tail narrows -->
  <path d="M256 96 C240 88 220 84 200 88" stroke="url(#snakeGrad2)" stroke-width="18" stroke-linecap="round" fill="none" opacity="0"/>
  <circle cx="198" cy="88" r="5" fill="#00cc66"/>

  <!-- SudoDeck text -->
  <text x="256" y="474" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#00ff88" filter="url(#glow)">SudoDeck</text>
</svg>
